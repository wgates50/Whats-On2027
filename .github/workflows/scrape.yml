name: Daily scrape

# Fetches every venue source, writes data/events.json + data/health.json, opens/closes
# "Source broken" issues, and commits the data (which triggers a redeploy). No AI involved.

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source ids (blank = all)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape
        run: npm run scrape -- ${ONLY:+--only "$ONLY"}
        env:
          ONLY: ${{ inputs.only }}
      - name: Sync health issues
        run: npm run issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "whats-on-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/health.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: scrape $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
