name: Daily scrape

# Fetches every venue source, writes data/events.json + data/health.json, opens/closes
# "Source broken" issues, and commits the data (which triggers a redeploy). No AI involved.

on:
  schedule:
    # 21:17 UTC daily. GitHub starts scheduled runs late (the old 05:17 slot started ~12:50–13:10 every
    # day), so an evening slot still lands well before the morning maintenance task (08:23 London).
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source ids (blank = all)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Opening hours (OpenStreetMap, weekly)
        run: npm run hours -- --max-age 7
        continue-on-error: true
      - name: Scrape
        run: npm run scrape -- ${ONLY:+--only "$ONLY"}
        env:
          ONLY: ${{ inputs.only }}
          # Optional free API keys (Settings → Secrets and variables → Actions). Sources are skipped without them.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
      - name: Sync health issues
        run: npm run issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "whats-on-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/health.json data/people.json data/cache data/hours.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: scrape $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
